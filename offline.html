<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      background-color: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; max-width: 320px; }
    button {
      background-color: #38bdf8;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h2>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h2>
  <p>โปรดตรวจสอบสัญญาณ Wi-Fi หรือเน็ตมือถือของคุณ แล้วลองใหม่อีกครั้ง</p>
  <button onclick="window.location.reload()">ลองเชื่อมต่อใหม่อีกครั้ง</button>
</body>
</html>
